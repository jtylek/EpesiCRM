; epesi: recommended php.ini settings for a production server
;
; Copy these lines into the php.ini the web server uses, then restart the web
; server (Apache, PHP-FPM or LiteSpeed). Administration -> About shows which
; ones your server already meets.
;
; - Linux or a VPS: `php --ini` names the file; the web server may use another
;   one (Ubuntu: /etc/php/8.x/fpm/php.ini or /etc/php/8.x/apache2/php.ini).
; - XAMPP: xampp\php\php.ini, then restart Apache in the XAMPP Control Panel.
; - Shared hosting: the OPcache sizes can only be set by the host. Ask them,
;   and set the rest in cPanel's "MultiPHP INI Editor" or "Select PHP Version
;   -> Options", or DirectAdmin's "PHP Settings".
;
; The same list, with the reason for each, is App\Support\Optimize\PhpSettings.

[PHP]
; Imports, long lists and setup need more than the usual 128M.
memory_limit = 256M

; Remember where files are instead of looking each one up on every request.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Error details belong in the log (storage/logs/laravel.log), not on the page.
display_errors = Off

; Don't announce the PHP version in every response.
expose_php = Off

; Leave assertion code out of compiled files (only php.ini can set this).
zend.assertions = -1

[opcache]
; Keep compiled PHP in memory. Without it, every request compiles epesi's
; PHP files again. On Windows with XAMPP, Apache also needs
; "ThreadStackSize 8388608" in its mpm_winnt_module block, or it crashes.
opcache.enable = 1

; Megabytes for compiled PHP: epesi alone needs about 50, every other site on
; the server more.
opcache.memory_consumption = 256

; Megabytes for the strings compiled files share.
opcache.interned_strings_buffer = 32

; epesi has about 15,000 PHP files, compiled views included.
opcache.max_accelerated_files = 20000

; Must stay on: cron rebuilds epesi's caches (epesi:optimize), and the web
; server has to notice the new files.
opcache.validate_timestamps = 1
