name: Security scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST (PHP + OWASP — advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Run Semgrep
        run: semgrep scan --config=p/php --config=p/owasp-top-ten --sarif --output=semgrep.sarif
      - name: Upload SARIF as build artifact (works regardless of GHAS licensing)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
      - name: Upload SARIF to GitHub code scanning (needs GitHub Advanced Security on private repos)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  composer-audit:
    name: Composer audit (dependency CVEs — advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        project:
          - "."
          - "modules/CRM/Mail"
          - "modules/Libs/PHPExcel"
          - "modules/Libs/TCPDF"
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: composer audit (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: composer audit --locked --no-interaction
