name: PHP checks

on:
  push:
  pull_request:

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint our PHP (skip vendor / RC third-party / Tests)
        run: |
          fail=0
          # NB: process substitution (not `find | while`) so `fail` propagates — a piped
          # while runs in a subshell and the parent never sees fail=1.
          while IFS= read -r f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=$f::${out}"
              fail=1
            fi
          done < <(
            find include modules admin console -name '*.php' \
              ! -path 'modules/Libs/RoundCube/RC/program/*' \
              ! -path 'modules/Libs/RoundCube/RC/vendor/*' \
              ! -path 'console/Develop/*' \
              ! -path 'modules/Tests/*'
            find . -maxdepth 1 -name '*.php'
          )
          exit $fail

  rector:
    name: Rector dry-run (PHP 8.2 deprecations — advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install Rector (isolated — avoids Epesi's php-parser conflict)
        run: mkdir -p /tmp/rector && composer --working-dir=/tmp/rector require rector/rector:^2 --no-progress --no-interaction
      - name: Rector --dry-run (reports suggested 8.2 changes, never fails the build)
        run: /tmp/rector/vendor/bin/rector process --dry-run --config rector-php82.php --no-progress-bar || true

  phpstan:
    name: PHPStan (offloaded from Karina's 4GB box; full analysis + baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install PHPStan (isolated)
        run: mkdir -p /tmp/phpstan && composer --working-dir=/tmp/phpstan require phpstan/phpstan:^2 --no-progress --no-interaction
      - name: PHPStan
        run: |
          if [ -f phpstan-baseline.neon ]; then
            # baseline committed → enforce: only NEW issues fail the build
            /tmp/phpstan/vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=3G --no-progress
          else
            # no baseline yet → generate one (download the artifact + commit it, then add
            # `includes: [phpstan-baseline.neon]` to phpstan.neon and CI starts enforcing).
            # No `|| true` here — if PHPStan crashes we want the job red + the crash in the log.
            echo "No phpstan-baseline.neon yet — generating one..."
            /tmp/phpstan/vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=3G --no-progress --generate-baseline phpstan-baseline.neon
            ls -la phpstan-baseline.neon
          fi
      - name: Upload generated baseline (first run only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpstan-baseline
          path: phpstan-baseline.neon
          if-no-files-found: ignore
