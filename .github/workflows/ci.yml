name: CI

# The lint/phpstan/rector jobs CLAUDE.md and phpstan.neon have always described.
# They did not exist until 2026-08-31 - see AI-shared/REFERENCE-optimization-opus-AI.md B1.
#
# Scope note: modules/Premium/ and modules/Custom/ are gitignored, separately-licensed
# nested git repos (CLAUDE.md, "Environment quirks"), so they are never present in a CI
# checkout. phpstan.neon/rector*.php exclude them explicitly so a local run reproduces
# what CI sees instead of drowning in findings CI can never report.

on:
  push:
    branches: [ epesi-adminlte, ess-migration ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'

jobs:
  lint:
    name: php -l
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # Vendored third-party trees are excluded: they ship as-is and are not ours to fix
      # (AI-shared/README.md, "Conventions for investigating/fixing bugs"). Roundcube is
      # ~35% of modules/ on its own.
      #
      # console/Develop/ used to be excluded here too, which did not match that rationale -
      # it is first-party, and all of it lints clean. Dropped 2026-08-31, when a new command
      # landed there and would otherwise have gone unlinted.
      - name: Lint all first-party PHP
        run: |
          set -euo pipefail
          mapfile -t files < <(find include modules admin console \
            *.php \
            -name '*.php' \
            -not -path 'modules/Libs/RoundCube/RC/*' \
            -not -path '*/vendor/*' \
            -not -path 'modules/Base/Theme/smarty/*' \
            -not -path 'modules/Tests/*' \
            2>/dev/null | sort -u)
          echo "Linting ${#files[@]} files"
          rc=0
          for f in "${files[@]}"; do
            if ! out=$(php -d error_reporting=E_ALL -l "$f" 2>&1); then
              echo "::error file=$f::$out"
              rc=1
            fi
          done
          exit $rc

  phpstan:
    name: PHPStan (level 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # vendor/ is committed to this repo, so the app needs no composer run. The
      # analysis tools live in their own project (tools/composer.json) precisely so they
      # stay out of it - see that file for why.
      - name: Install analysis tools
        run: composer install -d tools --no-interaction --no-progress

      # The baseline (phpstan-baseline.neon) absorbs the pre-existing findings, so this job
      # fails only on NEW ones. Regenerate it with --generate-baseline as real bugs get
      # cleared, so it shrinks over time.
      - name: Analyse
        run: tools/vendor/bin/phpstan analyse -c phpstan.neon --no-progress --error-format=github

  rector:
    name: Rector PHP 8.3 (advisory)
    runs-on: ubuntu-latest
    # Advisory only, as documented in rector-php83.php's own header: it surfaces 8.3-level
    # opportunities for review, it does not gate the build. Rector 2.x also re-prints
    # whitespace on files it touches, which would fail a blocking job for no real finding.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install analysis tools
        run: composer install -d tools --no-interaction --no-progress

      - name: Dry-run
        run: tools/vendor/bin/rector process --dry-run --config rector-php83.php --no-progress-bar

  docs:
    name: Docs match reality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # CLAUDE.md drifted from the code repeatedly (four wrong facts found 2026-08-31:
      # two invented console commands, a removed test skeleton, a CI job that did not
      # exist). Verifiable claims get verified - see AI-shared/REFERENCE-optimization-opus-AI.md B4.
      #
      # CLAUDE.md only, deliberately: it is the file Claude Code auto-loads every session
      # and the one that must be trustworthy. AI-shared/ is explicitly allowed to contain
      # approved-but-unimplemented plans (release-packaging-plan.md names an `update:apply`
      # command that does not exist yet, correctly), so the same check there would be noise.
      - name: Every console.php command named in CLAUDE.md must exist
        run: |
          set -euo pipefail
          # console.php needs no DB connection to print its command list.
          php console.php list --no-ansi 2>/dev/null \
            | grep -oE '^\s{2,}[a-z][a-z-]*(:[a-z-]+)+' | tr -d ' ' | sort -u > actual-commands.txt
          echo "console.php exposes $(wc -l < actual-commands.txt) commands"
          rc=0
          # No pipe into the loop: a `while read` in a pipeline runs in a subshell and
          # would throw away rc.
          for cmd in $(grep -ohE 'console\.php [a-z][a-z-]*(:[a-z-]+)+' CLAUDE.md | sed 's/console\.php //' | sort -u); do
            if grep -qx "$cmd" actual-commands.txt; then
              echo "  ok  $cmd"
            else
              echo "::error file=CLAUDE.md::documents 'console.php $cmd', which console.php does not expose"
              rc=1
            fi
          done
          exit $rc

  upgrade-gap:
    name: Install.php changes have a patch
    runs-on: ubuntu-latest
    # Advisory only, like the rector job above: plenty of *Install.php diffs are cosmetic
    # or pre-release and genuinely need no patch (the same judgement call CLAUDE.md's
    # "Working in this codebase" section names, and AI-shared/'s saved memory on it warns
    # against applying reflexively) - this surfaces the decision at review time, it never
    # blocks the build. See CLAUDE.md: a fix to an *Install.php default only reaches fresh
    # installs unless a patches/*.php file ships alongside it for the same module - the
    # single most common way a "fixed" bug regresses on upgrade. Item B6,
    # AI-shared/REFERENCE-optimization-opus-AI.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The other jobs only ever look at the checked-out tree; this one needs to diff
          # two commits, so it needs real history rather than the default shallow clone.
          fetch-depth: 0

      - name: Flag a modified *Install.php with no new patches/*.php alongside it
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          # Passed via env, never interpolated into the script below - a PR body is
          # attacker-controlled text and this is the safe way to read it in Actions.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Three-dot: diff against the merge-base, so this only sees what the PR
            # itself introduced, not unrelated commits landed on base since it branched.
            range="$BASE_SHA...$HEAD_SHA"
          else
            # A branch's first-ever push has no prior commit (all-zero SHA, or unset for
            # a manually-dispatched run) - nothing to diff against, and nothing wrong
            # with that.
            if [ -z "${PUSH_BEFORE:-}" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous commit to compare against - skipping."
              exit 0
            fi
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi

          # Opt-out: a "No-Patch-Needed:" trailer in any commit message in range, or
          # (pull_request only) anywhere in the PR description - for a change that is
          # genuinely cosmetic/pre-release and needs no patch. Applies to the whole run
          # rather than per file: this is advisory, not a gate, so a little
          # over-permissiveness here costs nothing.
          if git log --format=%B "$range" 2>/dev/null | grep -qi 'No-Patch-Needed:'; then
            echo "No-Patch-Needed trailer found in a commit message - skipping."
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && printf '%s' "$PR_BODY" | grep -qi 'No-Patch-Needed:'; then
            echo "No-Patch-Needed trailer found in the PR description - skipping."
            exit 0
          fi

          diff_output=$(git diff --name-status "$range" 2>/dev/null || true)

          # Only a *modification* to an existing Install.php risks the upgrade gap - a
          # brand new one (status A) belongs to a module nobody has installed yet, so
          # every install picks it up fresh the same way.
          mapfile -t changed_installs < <(printf '%s\n' "$diff_output" | awk -F'\t' '$1=="M" && $NF ~ /Install\.php$/ {print $NF}')
          # A patch only answers *this* diff if it's new in it - an already-shipped
          # patches/*.php file proves nothing about the Install.php change under review.
          mapfile -t added_patches < <(printf '%s\n' "$diff_output" | awk -F'\t' '$1=="A" && $NF ~ /\/patches\/[^\/]+\.php$/ {print $NF}')

          rc=0
          for f in "${changed_installs[@]:-}"; do
            [ -z "$f" ] && continue
            module_dir=$(dirname "$f")
            has_patch=0
            for p in "${added_patches[@]:-}"; do
              case "$p" in
                "$module_dir/patches/"*) has_patch=1; break ;;
              esac
            done
            if [ "$has_patch" = "0" ]; then
              echo "::warning file=$f::modified with no new patches/*.php alongside it in this diff - existing installs won't get this change unless a patch is added. If this is cosmetic/pre-release and genuinely needs no patch, add a 'No-Patch-Needed: <reason>' trailer to a commit message or the PR description."
              rc=1
            fi
          done
          exit $rc
